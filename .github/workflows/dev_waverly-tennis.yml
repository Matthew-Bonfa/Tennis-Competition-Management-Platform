# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - waverly-tennis

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # 1. Install dependencies, generate Prisma client, compile NestJS, and drop devDependencies
      - name: Build backend application
        run: |
          npm install --ignore-scripts
          cd backend && npx prisma generate && cd ..
          npm run build --workspace=backend
          npm prune --omit=dev

      # 2. Upload the pre-built application ready for execution
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83099428D74F4C3983A2BE0D05035B53 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC477D8F26BE42F98EE48064956EE459 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_70C161B0A34842C89D87737B7E5D4920 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waverly-tennis'
          slot-name: 'Production'
          package: .
