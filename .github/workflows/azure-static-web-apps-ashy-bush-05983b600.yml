name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_... }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          
          # 1. Point to the root of the monorepo so npm understands workspaces
          app_location: "/" 
          
          # 2. Leave API blank (we use App Service)
          api_location: "" 
          
          # 3. Explicitly tell Azure where Vite will output the compiled files
          output_location: "frontend/dist" 
          
          # 4. Override Azure's default build with your workspace commands
          app_build_command: "npm install --ignore-scripts && npm run build --workspace=frontend"
          
        env:
          VITE_API_URL: "https://waverly-tennis-ewgcbreybqa4hdbz.australiaeast-01.azurewebsites.net/api"
    

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_BUSH_05983B600 }}
          action: "close"
